<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="dashboard">

      <!-- Clock Section -->
      <section id="clock-section">
        <p id="clock-time"></p>
        <p id="clock-date"></p>
        <p id="clock-greeting"></p>
      </section>

      <!-- Focus Timer Section -->
      <section id="timer-section">
        <p id="timer-display"></p>
        <p id="timer-done" hidden>Session complete!</p>
        <div class="timer-controls">
          <button id="timer-start" type="button" aria-label="Start timer">Start</button>
          <button id="timer-stop" type="button" aria-label="Stop timer">Stop</button>
          <button id="timer-reset" type="button" aria-label="Reset timer">Reset</button>
        </div>
      </section>

      <!-- To-Do Section -->
      <section id="todo-section">
        <form id="todo-form" novalidate>
          <input
            id="todo-input"
            type="text"
            maxlength="200"
            placeholder="Add a new task..."
            autocomplete="off"
            aria-label="Task description"
          />
          <button type="submit" aria-label="Add task">Add</button>
        </form>
        <p id="todo-error" role="alert" aria-live="assertive"></p>
        <ul id="todo-list"></ul>
      </section>

      <!-- Quick Links Section -->
      <section id="links-section">
        <form id="links-form" novalidate>
          <input
            id="link-label"
            type="text"
            maxlength="50"
            placeholder="Label"
            autocomplete="off"
            aria-label="Link label"
          />
          <input
            id="link-url"
            type="url"
            maxlength="2048"
            placeholder="https://example.com"
            autocomplete="off"
            aria-label="Link URL"
          />
          <button type="submit" aria-label="Add link">Add</button>
        </form>
        <p id="links-error" role="alert" aria-live="assertive"></p>
        <ul id="links-list"></ul>
      </section>

    </main>

    <div id="toast-container" role="alert" aria-live="polite"></div>

    <script src="js/script.js"></script>
  </body>
</html>
